# Holt jede Woche die offiziellen Diyanet-Gebetszeiten für Marktoberdorf
# und speichert sie in gebetszeiten.json (+ gebetszeiten.js).
# Manuell starten: GitHub → Actions → „Gebetszeiten aktualisieren“ → „Run workflow“.
name: Gebetszeiten aktualisieren

on:
  schedule:
    - cron: "17 2 * * 1"      # jeden Montag 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diyanet-Zeiten laden
        run: python3 tools/diyanet_laden.py
      - name: Änderungen speichern
        run: |
          if git diff --quiet -- gebetszeiten.json gebetszeiten.js; then
            echo "Keine neuen Zeiten."
            exit 0
          fi
          git config user.name "gebetszeiten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gebetszeiten.json gebetszeiten.js
          git commit -m "Gebetszeiten von Diyanet aktualisiert"
          git push
